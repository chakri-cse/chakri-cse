<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 638" width="1080" height="638" role="img" aria-labelledby="title description">
  <title id="title">Credit risk modeling lifecycle</title>
  <desc id="description">Prepare credit bureau and application data and engineer historical features. Design a binary target for reaching 90 or more days past due within 12 months using roll-rate and vintage analysis. Combine candidate features and the target for feature selection. Train, tune, validate, and select a model. Obtain stakeholder approval before deployment. Monitor outcomes and drift, with redevelopment feeding back to data and features.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0 0L10 5L0 10Z" fill="#426478"/>
    </marker>
    <marker id="feedback-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L10 5L0 10Z" fill="#16756D"/>
    </marker>
    <style>
      text { font-family: 'Segoe UI', Arial, sans-serif; }
      .heading { fill: #142D3C; font-size: 35px; font-weight: 700; }
      .subtitle { fill: #415A68; font-size: 17px; }
      .card { fill: #FFFFFF; stroke: #C7D6DC; stroke-width: 1.5; }
      .card-title { fill: #163648; font-size: 20px; font-weight: 700; }
      .detail { fill: #35515F; font-size: 16px; }
      .number-box { fill: #DCECF4; }
      .number { fill: #1C526B; font-size: 14px; font-weight: 700; text-anchor: middle; }
      .flow { fill: none; stroke: #426478; stroke-width: 2; stroke-linejoin: round; }
      .feedback { fill: none; stroke: #16756D; stroke-width: 2; stroke-linejoin: round; stroke-dasharray: 6 5; }
      .feedback-label { fill: #1A635D; font-size: 15px; font-weight: 600; text-anchor: middle; }
    </style>
  </defs>

  <rect x="1" y="1" width="1078" height="636" rx="22" fill="#F3F7F9" stroke="#C7D6DC" stroke-width="2"/>
  <text x="46" y="57" class="heading">Credit risk modeling lifecycle</text>
  <text x="47" y="85" class="subtitle">From bureau and application data to monitored credit decisioning</text>

  <g class="flow">
    <path d="M277 234V252H524M771 234V252H524"/>
    <path d="M524 252V271" marker-end="url(#arrow)"/>
    <path d="M193 363V403" marker-end="url(#arrow)"/>
    <path d="M341 473H375" marker-end="url(#arrow)"/>
    <path d="M671 473H705" marker-end="url(#arrow)"/>
  </g>
  <path d="M854 542V586H24V180H45" class="feedback" marker-end="url(#feedback-arrow)"/>

  <g transform="translate(46 118)">
    <rect width="462" height="116" rx="14" class="card"/>
    <rect x="18" y="17" width="27" height="27" rx="7" class="number-box"/>
    <text x="31.5" y="36" class="number">1</text>
    <text x="56" y="37" class="card-title">Data preparation and features</text>
    <text x="18" y="69" class="detail">Structure credit bureau and application records.</text>
    <text x="18" y="93" class="detail">Derive delinquency and credit profile features.</text>
  </g>

  <g transform="translate(540 118)">
    <rect width="462" height="116" rx="14" class="card"/>
    <rect x="18" y="17" width="27" height="27" rx="7" class="number-box"/>
    <text x="31.5" y="36" class="number">2</text>
    <text x="56" y="37" class="card-title">Target design</text>
    <text x="18" y="69" class="detail">90+ days past due within 12 months.</text>
    <text x="18" y="93" class="detail">Use roll-rate and vintage analysis.</text>
  </g>

  <g transform="translate(46 272)">
    <rect width="956" height="91" rx="14" class="card"/>
    <rect x="18" y="16" width="27" height="27" rx="7" class="number-box"/>
    <text x="31.5" y="35" class="number">3</text>
    <text x="56" y="36" class="card-title">Feature selection</text>
    <text x="18" y="65" class="detail">Screen for coverage, variation, redundancy, target relevance, and model contribution.</text>
  </g>

  <g transform="translate(46 404)">
    <rect width="295" height="138" rx="14" class="card"/>
    <rect x="18" y="17" width="27" height="27" rx="7" class="number-box"/>
    <text x="31.5" y="36" class="number">4</text>
    <text x="56" y="37" class="card-title">Develop and validate</text>
    <text x="18" y="69" class="detail">Train and tune candidate models.</text>
    <text x="18" y="93" class="detail">Compare performance and stability.</text>
    <text x="18" y="117" class="detail">Select the final model.</text>
  </g>

  <g transform="translate(376 404)">
    <rect width="295" height="138" rx="14" class="card"/>
    <rect x="18" y="17" width="27" height="27" rx="7" class="number-box"/>
    <text x="31.5" y="36" class="number">5</text>
    <text x="56" y="37" class="card-title">Approve and deploy</text>
    <text x="18" y="69" class="detail">Review with stakeholders.</text>
    <text x="18" y="93" class="detail">Obtain approval before deployment.</text>
    <text x="18" y="117" class="detail">Integrate scoring into decisioning.</text>
  </g>

  <g transform="translate(706 404)">
    <rect width="296" height="138" rx="14" class="card"/>
    <rect x="18" y="17" width="27" height="27" rx="7" fill="#DCEFEA"/>
    <text x="31.5" y="36" class="number">6</text>
    <text x="56" y="37" class="card-title">Monitor and review</text>
    <text x="18" y="69" class="detail">Track approvals and credit outcomes.</text>
    <text x="18" y="93" class="detail">Check feature and score drift.</text>
    <text x="18" y="117" class="detail">Assess business impact.</text>
  </g>

  <text x="440" y="614" class="feedback-label">Redevelopment returns to data preparation and features</text>
</svg>
